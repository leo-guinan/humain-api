[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "humain-api"
version = "0.1.0"
description = "Transport-neutral primitives for trust-aware resolution of public pointers"
requires-python = ">=3.10"
dependencies = ["cryptography>=41"]
license = {text = "MIT"}

[project.optional-dependencies]
ble = ["bleak>=0.22"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
